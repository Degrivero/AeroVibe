# Server block del dominio principal (landing estática).
# Copiar/adaptar a /etc/nginx/sites-available/ y hacer symlink en sites-enabled.

server {
    listen 80;
    listen [::]:80;
    server_name aerovibe.app www.aerovibe.app;

    root /var/www/aerovibe-web;   # Ajustar ruta al build de aerovibe-web
    index index.html;

    # index.html = router shell: no cachear (cambia en cada deploy)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Assets con hash en nombre (Vite): cache largo
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # JS/CSS/imágenes servidos en raíz (favicon, etc.)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Resto (SPA fallback y páginas): cache moderado; el fallback sirve index.html (sin cache vía location = /index.html)
    location / {
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSL (ejemplo con certbot)
    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    # ssl_certificate /etc/letsencrypt/live/aerovibe.app/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/aerovibe.app/privkey.pem;
}
